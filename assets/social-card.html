<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<title>MovieBox project social preview artwork</title>
<style>
:root{color-scheme:dark;--bg:#05060a;--ink:#eef1f8;--muted:#aab3c7;--amber:#ffbf5a;--cyan:#5ef2ff;--magenta:#ff4fa8}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;padding:40px 60px;background-image:radial-gradient(ellipse at 80% 40%,#35203d80,transparent 55%),radial-gradient(ellipse at 20% 75%,#18344075,transparent 60%)}
body:before,body:after{content:"";position:absolute;top:100px;bottom:75px;width:14px;background:repeating-linear-gradient(90deg,#36121c 0,#63192c 5px,#170c14 8px,#36121c 14px);border:1px solid #8d2b4155}
body:before{left:0}body:after{right:0}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:25px;border-bottom:2px dotted #ffbf5a88}
.brand{display:flex;align-items:center;gap:14px;font-family:Impact,"Arial Narrow",sans-serif;font-size:29px;letter-spacing:1px}.brand img{width:35px;height:35px}.brand em{color:var(--amber);font-style:normal}
.eyebrow,.caption,.ticket,footer{font-family:"Cascadia Mono",Consolas,monospace;letter-spacing:2px}
.eyebrow{font-size:13px;color:var(--muted)}
main{padding-top:36px;text-align:center}.caption{margin:0;color:var(--muted);font-size:14px}
h1{font-family:Impact,"Arial Narrow",sans-serif;font-size:91px;line-height:1.02;letter-spacing:1px;margin:16px 0 13px;font-weight:400}
h1 span{color:var(--amber)}
.subtitle{font-size:20px;color:#c8cede;margin:0}
.tickets{display:flex;justify-content:center;gap:12px;margin-top:35px}
.ticket{position:relative;border:1px solid #555767;background:#10131e;border-radius:7px;padding:15px 17px;font-size:15px;color:#eef1f8;letter-spacing:1px}
.ticket:first-child{background:#ffcc7b;color:#1d1409;border-color:#ffdc9d}
.ticket:before,.ticket:after{position:absolute;content:"";background:var(--bg);width:10px;height:10px;border-radius:50%;left:calc(50% - 5px)}
.ticket:before{top:-5px}.ticket:after{bottom:-5px}
footer{position:absolute;left:60px;right:60px;bottom:27px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff24;padding-top:19px;font-size:12px;color:var(--muted)}footer strong{color:var(--cyan);font-weight:400;letter-spacing:1px}.independent{color:var(--amber)}
</style>
</head>
<body>
<header><div class="brand"><img src="cinema-favicon.svg" alt=""><span>MOVIEBOX <em>PROJECTS</em></span></div><span class="eyebrow">INDEPENDENT COMMUNITY PROJECTS</span></header>
<main><p class="caption">YOUR SCREEN. YOUR STORY.</p><h1>NOW SHOWING<br>ON EVERY <span>SCREEN.</span></h1><p class="subtitle">Published downloads. Genuine app screens. Clear setup guides.</p><div class="tickets"><span class="ticket">WINDOWS PC</span><span class="ticket">ANDROID PHONE</span><span class="ticket">SAMSUNG TIZEN</span><span class="ticket">ANDROID TV</span></div></main>
<footer><span class="independent">COMMUNITY CUT · NOT AFFILIATED WITH MOVIEBOX</span><strong>emransm877.github.io/moviebox-projects</strong></footer>
</body>
</html>
